[project]
name = "template-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import順序)
    "UP",  # pyupgrade (古い構文の自動更新)
    "B",   # flake8-bugbear (バグの原因になりやすいパターン)
    "ANN", # type annotations (型アノテーション)
]
